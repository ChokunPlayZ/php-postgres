; Defense in depth, NOT a substitute for the PHP engine patches.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
allow_url_include = Off
enable_dl = Off

; Also blocks the follow-up session vector (CVE-2026-115560).
; Must apply before request parsing, not via application ini_set().
session.upload_progress.enabled = Off
session.use_strict_mode = On
session.use_only_cookies = On
session.cookie_httponly = On
session.cookie_samesite = Lax

memory_limit = 128M
post_max_size = 32M
upload_max_filesize = 16M
max_file_uploads = 10
max_input_vars = 1000
max_input_nesting_level = 32
max_execution_time = 30
max_input_time = 30

opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.enable_cli = On
