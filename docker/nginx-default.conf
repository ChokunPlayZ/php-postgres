server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    if ($request_method = TRACE) {
        return 405;
    }

    # Liveness is independent of PHP-FPM, application routes and database state.
    location = /healthz {
        alias /usr/local/share/php-postgres/health.txt;
    }

    location ~ "(^|/)\.(?!well-known(?:/|$))" {
        return 403;
    }
    location ~* "(?:^|/)(?:composer\.(?:json|lock)|(?:docker-compose|compose)\.ya?ml|Dockerfile)$" {
        return 403;
    }

    # Keep before the PHP handler. Add equivalent rules for other upload paths.
    location ~* "^/uploads/.*\.(?:php[0-9]*|phtml|phar)(?:[./]|$)" {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php-postgres.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve PHP-like files or PATH_INFO requests as static source.
    location ~* "\.(?:php[0-9]*|phtml|phar)(?:[./]|$)" {
        return 403;
    }
}
