ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 60

# Bound decoded bodies, including chunked requests, before PHP parses them.
LimitRequestBody 33554432
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Keep these settings administrative, so application code cannot re-enable them.
php_admin_flag session.upload_progress.enabled Off
php_admin_flag allow_url_include Off
php_admin_flag enable_dl Off

<Directory /var/www/html>
    Options -Indexes -Includes -ExecCGI
    # Rewrite/auth rules remain usable, but .htaccess cannot change PHP options.
    AllowOverride FileInfo AuthConfig Limit
</Directory>

<DirectoryMatch "(^|/)\.(?!well-known(?:/|$))">
    Require all denied
</DirectoryMatch>
<FilesMatch "(?i)^(?:\.(?!well-known)|composer\.(?:json|lock)$|(?:docker-compose|compose)\.ya?ml$|Dockerfile$)">
    Require all denied
</FilesMatch>

# Applications using other upload paths must add an equivalent execution denial.
<Directory /var/www/html/uploads>
    AllowOverride None
    Options -Indexes -Includes -ExecCGI
    <FilesMatch "(?i)\.(?:php[0-9]*|phtml|phar)(?:\.|$)">
        Require all denied
    </FilesMatch>
</Directory>

# Liveness is independent of application routes, credentials and database state.
Alias /healthz /usr/local/share/php-postgres/health.txt
<Directory /usr/local/share/php-postgres>
    AllowOverride None
    Require all granted
</Directory>
